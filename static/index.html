<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScamSloth</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦥</text></svg>"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 2.5rem;
        margin: 0 0 8px;
      }
      p {
        color: #ccc;
        margin: 0 0 24px;
      }
      .picker {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .pick {
        border: 1px solid #fff;
        color: #fff;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
      }
      .pick:hover {
        background: #222;
      }
      #fileName {
        color: #fff;
        font-size: 1rem;
        word-break: break-all;
      }
      button {
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #ddd;
      }
      button:disabled {
        background: #555;
        cursor: wait;
      }
      #status {
        color: #aaa;
        margin-top: 16px;
        min-height: 1.2em;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 12px auto 0;
        border: 3px solid #333;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .card {
        width: 100%;
        max-width: 560px;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 16px 20px;
        margin-top: 16px;
        text-align: left;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      .scam {
        border-color: #f55;
      }
      .scam h2 {
        color: #f55;
      }
      .safe {
        border-color: #5d5;
      }
      .safe h2 {
        color: #5d5;
      }
      .card ul {
        margin: 8px 0 0;
        padding-left: 20px;
        color: #ddd;
        font-size: 1.05rem;
      }
      .card a {
        color: #9cf;
      }
      #numberSummary {
        color: #ddd;
        font-size: 1.05rem;
        margin: 0;
      }
      .transcript {
        color: #ddd;
        white-space: pre-wrap;
        font-size: 1.15rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>ScamSloth 🦥</h1>
    <p>Upload a voicemail to check if it's a scam.</p>
    <div class="picker">
      <label for="file" class="pick">Choose voicemail</label>
      <span id="fileName">No file chosen</span>
    </div>
    <input
      type="file"
      id="file"
      accept="audio/*,.m4a,.mp3,.wav,.amr"
      hidden
      onchange="
        document.getElementById('fileName').textContent = this.files[0]
          ? this.files[0].name
          : 'No file chosen'
      "
    />
    <button id="go" onclick="analyze()">Check voicemail</button>
    <div id="status"></div>
    <div id="spinner" class="spinner" hidden></div>
    <div id="verdict" class="card" hidden>
      <h2 id="verdictTitle"></h2>
      <ul id="flags"></ul>
    </div>
    <div id="numberCard" class="card" hidden>
      <h2 id="numberTitle"></h2>
      <p id="numberSummary"></p>
      <ul id="reports"></ul>
    </div>
    <div id="transcriptCard" class="card" hidden>
      <h2>Transcript</h2>
      <div id="transcript" class="transcript"></div>
    </div>
    <script>
      async function analyze() {
        const file = document.getElementById("file").files[0];
        const status = document.getElementById("status");
        const spinner = document.getElementById("spinner");
        if (!file) {
          status.textContent = "Pick a voicemail first.";
          return;
        }
        const btn = document.getElementById("go");
        btn.disabled = true;
        status.textContent = "Checking… this can take up to a minute.";
        spinner.hidden = false;
        document.getElementById("verdict").hidden = true;
        document.getElementById("numberCard").hidden = true;
        document.getElementById("transcriptCard").hidden = true;
        try {
          const form = new FormData();
          form.append("audio", file);
          const res = await fetch("/analyze", { method: "POST", body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || res.status);
          document.getElementById("transcript").textContent = data.transcript;
          document.getElementById("transcriptCard").hidden = false;
          if (data.verdict) {
            const card = document.getElementById("verdict");
            const scam = data.verdict === "scam";
            card.className = "card " + (scam ? "scam" : "safe");
            document.getElementById("verdictTitle").textContent = scam
              ? "🚨 Scam"
              : "✅ Not scam";
            const flags = document.getElementById("flags");
            flags.innerHTML = "";
            for (const f of data.red_flags || []) {
              const li = document.createElement("li");
              li.textContent = f;
              flags.appendChild(li);
            }
            card.hidden = false;
          }
          if (data.number) {
            document.getElementById("numberTitle").textContent =
              "📞 Callback number " + data.number.number;
            const summary = document.getElementById("numberSummary");
            const list = document.getElementById("reports");
            list.innerHTML = "";
            const n = data.number.reports.length;
            if (data.number.error) {
              summary.textContent = "Couldn't check this number right now.";
            } else if (n > 0) {
              summary.textContent =
                "Callback number reported as a scam on " +
                n +
                (n === 1 ? " site" : " sites");
              for (const r of data.number.reports) {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = r.link;
                a.target = "_blank";
                a.rel = "noopener";
                a.textContent = r.title;
                li.appendChild(a);
                list.appendChild(li);
              }
            } else {
              summary.textContent = "No scam reports found for this number";
            }
            document.getElementById("numberCard").hidden = false;
          }
          status.textContent = data.error
            ? "Model error: " + data.error
            : "Done in " +
              data.seconds +
              "s" +
              (data.model_seconds
                ? " (model " + data.model_seconds + "s)"
                : "");
        } catch (e) {
          status.textContent = "Error: " + e.message;
        } finally {
          btn.disabled = false;
          spinner.hidden = true;
        }
      }
    </script>
  </body>
</html>
