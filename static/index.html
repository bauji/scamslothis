<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScamSloth</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 2.5rem;
        margin: 0 0 8px;
      }
      p {
        color: #ccc;
        margin: 0 0 24px;
      }
      input[type="file"] {
        color: #ccc;
        margin-bottom: 16px;
        max-width: 100%;
      }
      button {
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #ddd;
      }
      button:disabled {
        background: #555;
        cursor: wait;
      }
      #status {
        color: #aaa;
        margin-top: 16px;
        min-height: 1.2em;
      }
      .card {
        width: 100%;
        max-width: 560px;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 16px 20px;
        margin-top: 16px;
        text-align: left;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      .scam {
        border-color: #f55;
      }
      .scam h2 {
        color: #f55;
      }
      .safe {
        border-color: #5d5;
      }
      .safe h2 {
        color: #5d5;
      }
      .card ul {
        margin: 8px 0 0;
        padding-left: 20px;
        color: #ddd;
      }
      .transcript {
        color: #bbb;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>ScamSloth 🦥</h1>
    <p>Upload a voicemail to check if it's a scam.</p>
    <input type="file" id="file" accept="audio/*,.m4a,.mp3,.wav,.amr" />
    <button id="go" onclick="analyze()">Check voicemail</button>
    <div id="status"></div>
    <div id="verdict" class="card" hidden>
      <h2 id="verdictTitle"></h2>
      <ul id="flags"></ul>
    </div>
    <div id="transcriptCard" class="card" hidden>
      <h2>Transcript</h2>
      <div id="transcript" class="transcript"></div>
    </div>
    <script>
      async function analyze() {
        const file = document.getElementById("file").files[0];
        const status = document.getElementById("status");
        if (!file) {
          status.textContent = "Pick a voicemail first.";
          return;
        }
        const btn = document.getElementById("go");
        btn.disabled = true;
        status.textContent = "Checking… this can take up to a minute.";
        document.getElementById("verdict").hidden = true;
        document.getElementById("transcriptCard").hidden = true;
        try {
          const form = new FormData();
          form.append("audio", file);
          const res = await fetch("/analyze", { method: "POST", body: form });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || res.status);
          document.getElementById("transcript").textContent = data.transcript;
          document.getElementById("transcriptCard").hidden = false;
          if (data.verdict) {
            const card = document.getElementById("verdict");
            const scam = data.verdict === "scam";
            card.className = "card " + (scam ? "scam" : "safe");
            document.getElementById("verdictTitle").textContent = scam
              ? "🚨 Scam"
              : "✅ Not scam";
            const flags = document.getElementById("flags");
            flags.innerHTML = "";
            for (const f of data.red_flags || []) {
              const li = document.createElement("li");
              li.textContent = f;
              flags.appendChild(li);
            }
            card.hidden = false;
          }
          status.textContent = data.error
            ? "Model error: " + data.error
            : "Done in " +
              data.seconds +
              "s" +
              (data.model_seconds
                ? " (model " + data.model_seconds + "s)"
                : "");
        } catch (e) {
          status.textContent = "Error: " + e.message;
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
